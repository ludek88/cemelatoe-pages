name: Deploy Camela Website

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/validate_site_seo.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camela-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate technical SEO and required files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/CNAME
          grep -q "camelatoe.com" site/CNAME
          python3 scripts/validate_site_seo.py

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip deploy when Cloudflare secrets are missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        shell: bash
        run: |
          echo "Cloudflare deploy skipped."
          echo "Add GitHub repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable automatic deploys."

      - name: Deploy site directory
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler pages deploy site \
            --project-name camela-toe \
            --branch main
